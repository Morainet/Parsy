<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Parsy favicon: indigo rounded square with a white bold letter P flanked
    by two clean curly braces. All glyphs are hand-tuned vector paths (no
    text element) so it renders identically everywhere.
    Brand color hsl(239 84% 60%) ~ #2f44e0.
  -->

  <!-- Background: indigo rounded square -->
  <rect width="512" height="512" rx="116" ry="116" fill="#2f44e0"/>

  <!-- Subtle top sheen for depth -->
  <rect width="512" height="512" rx="116" ry="116" fill="url(#sheen)"/>
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!--
    Left curly brace "{" — a single filled path.
    Built as: top serif curving in to a mid spine bump (pointing right at y=256),
    then mirroring down to a bottom serif. Stroke-style with round joins.
  -->
  <path
    fill="#ffffff"
    d="M 150 130
       C 128 130 120 148 120 168
       L 120 214
       C 120 234 110 246 92 246
       C 110 246 120 258 120 278
       L 120 324
       C 120 344 128 362 150 362
       L 150 344
       C 142 344 138 338 138 324
       L 138 282
       C 138 264 130 254 118 250
       C 130 246 138 236 138 218
       L 138 168
       C 138 154 142 148 150 148
       Z"
  />

  <!-- Right curly brace "}" — mirrored copy of the left -->
  <path
    fill="#ffffff"
    d="M 362 130
       C 384 130 392 148 392 168
       L 392 214
       C 392 234 402 246 420 246
       C 402 246 392 258 392 278
       L 392 324
       C 392 344 384 362 362 362
       L 362 344
       C 370 344 374 338 374 324
       L 374 282
       C 374 264 382 254 394 250
       C 382 246 374 236 374 218
       L 374 168
       C 374 154 370 148 362 148
       Z"
  />

  <!--
    Letter "P" — bold, centered. Filled path.
    Stem on the left, bowl on the right with a hollow counter.
  -->
  <path
    fill="#ffffff"
    d="M 214 160
       L 280 160
       C 322 160 348 188 348 224
       C 348 260 322 288 280 288
       L 244 288
       L 244 352
       L 214 352
       Z
       M 244 188
       L 244 260
       L 276 260
       C 300 260 316 246 316 224
       C 316 202 300 188 276 188
       Z"
  />
</svg>
