<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Parsy favicon: three offset rounded bars (white / indigo / white) on a
    near-black charcoal squircle. The staggered bars evoke nested JSON levels
    and data layers. Pure geometric mark, no letterforms.
    Background #0e0f1a, accent indigo #6366f1.
  -->

  <!-- Background: charcoal rounded square -->
  <rect width="512" height="512" rx="116" ry="116" fill="#0e0f1a"/>

  <!-- Subtle top sheen for depth -->
  <rect width="512" height="512" rx="116" ry="116" fill="url(#sheen)"/>
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Three offset bars: top white, middle indigo (shifted right), bottom white -->
  <rect x="140" y="148" width="232" height="56" rx="28" fill="#ffffff"/>
  <rect x="172" y="228" width="232" height="56" rx="28" fill="#6366f1"/>
  <rect x="140" y="308" width="232" height="56" rx="28" fill="#ffffff"/>
</svg>
